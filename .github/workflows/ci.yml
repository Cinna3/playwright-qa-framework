name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - os: ubuntu-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Smoke suite (fast gate)
        run: pytest -m smoke --browser=${{ matrix.browser }} -v

      - name: Full suite
        run: pytest --browser=${{ matrix.browser }} -v --tb=short

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.browser }}
          path: reports/
          retention-days: 14

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.os }}-${{ matrix.browser }}
          path: logs/
          retention-days: 7
