<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Framework Demo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Framework Demo App</h1>
    <p id="intro">A deterministic page for browser capability tests.</p>

    <section>
      <h2>Interaction</h2>
      <button id="toggle-button" type="button">Reveal details</button>
      <p id="details" hidden>These details were revealed by JavaScript.</p>
    </section>

    <section>
      <h2>Form</h2>
      <form id="signup-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <p id="email-error" class="error" hidden>Enter a valid email address</p>
        <button type="submit" id="submit-button">Sign up</button>
      </form>
      <p id="signup-success" class="success" hidden>You are signed up</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
