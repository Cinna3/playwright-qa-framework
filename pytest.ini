[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -n auto runs tests in parallel across CPU cores using xdist. A UI test suite
# is dominated by waiting, so parallelism is close to free wall-clock savings.
# --reruns 1 retries a test once, which absorbs genuine flakiness from timing
# and third-party services. Do NOT raise this to paper over real defects.
addopts =
    -q
    -n auto
    --dist loadgroup
    --html=reports/report.html
    --self-contained-html
    --reruns 1
    --tb=short

markers =
    smoke: fast health check, run on every commit
    contract: response shape and schema guarantees
    negative: bad input and boundary conditions
    performance: latency and budget checks
    ui: browser-based tests
