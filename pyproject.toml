[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-framework"
version = "0.1.0"
description = "Reusable Playwright/pytest test framework: config, logging, API client and shared fixtures"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pytest>=8.0",
    "pytest-playwright>=0.4",
]

[project.entry-points.pytest11]
qa_framework = "qa_framework.plugin"

[tool.setuptools.packages.find]
include = ["qa_framework*"]
